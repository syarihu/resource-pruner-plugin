name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Build plugin with latest Gradle and publish to Maven Local
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test core module
        run: ./gradlew :resource-pruner-core:build -PexcludeExample --no-configuration-cache

      - name: Build and test plugin module
        run: ./gradlew :resource-pruner-gradle-plugin:build -PexcludeExample --no-configuration-cache

      - name: Publish all modules to Maven Local
        run: ./gradlew :resource-pruner-core:publishToMavenLocal :resource-pruner-gradle-plugin:publishToMavenLocal -PexcludeExample --no-configuration-cache

      - name: Upload Maven Local artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-local
          path: ~/.m2/repository/net/syarihu/
          retention-days: 1

  # Test plugin compatibility with different Gradle versions
  #
  # Note: Example project tests (test scripts) only run on Gradle 9.x because some example
  # dependencies (e.g., app.cash.paraphrase 0.5.0+) require Gradle 9.0 or newer.
  # Gradle 8.x jobs verify plugin compatibility by assembling the plugin modules only
  # (without tests, since test dependencies like kotest also require newer Kotlin).
  # The build job runs core and plugin module/unit tests with the latest Gradle,
  # while example project test scripts are covered by the Gradle 9.x compatibility job.
  test-compatibility:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gradle 8.7: ProjectDependency.getPath() doesn't exist, getDependencyProject() exists
          # Checksums from https://gradle.org/release-checksums/
          - gradle: "8.7"
            gradle_checksum: "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d"
            agp: "8.5.2"
            name: "Gradle 8.7 + AGP 8.5.2"
            run_example_tests: false
          # Gradle 8.11: Both getPath() and getDependencyProject() exist
          - gradle: "8.11.1"
            gradle_checksum: "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"
            agp: "8.7.3"
            name: "Gradle 8.11 + AGP 8.7.3"
            run_example_tests: false
          # Gradle 9.x: getPath() exists, getDependencyProject() is removed
          - gradle: "9.2.1"
            gradle_checksum: "72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f"
            agp: "8.13.2"
            name: "Gradle 9.2 + AGP 8.13.2"
            run_example_tests: true
          # AGP 9.x: built-in Kotlin; also covers the Compose-enabled dependent app (#57)
          - gradle: "9.9.0"
            gradle_checksum: "0b00b0ffe07c4d4789c12d4935a44a7057d55774b7540bd4a3f76f336deb177a"
            agp: "9.5.1"
            name: "Gradle 9.9 + AGP 9.5.1"
            run_example_tests: true

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download Maven Local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-local
          path: ~/.m2/repository/net/syarihu/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Update Gradle version
        run: ./gradlew wrapper --gradle-version=${{ matrix.gradle }} --gradle-distribution-sha256-sum=${{ matrix.gradle_checksum }} -PexcludeExample --no-configuration-cache

      - name: Update AGP version
        run: sed -i 's/agp = ".*"/agp = "${{ matrix.agp }}"/' gradle/plugin.versions.toml

      - name: Show versions
        run: |
          echo "Gradle version:"
          ./gradlew --version | grep "Gradle"
          echo "AGP version:"
          grep "agp = " gradle/plugin.versions.toml

      - name: Build plugin modules (without tests - tests run in the build job with latest Gradle)
        if: ${{ !matrix.run_example_tests }}
        run: ./gradlew :resource-pruner-core:assemble :resource-pruner-gradle-plugin:assemble -PexcludeExample --no-configuration-cache

      # Example dependencies (core 1.19.1, Compose 1.12) require AGP 9.1+, so the AGP 8 entry only runs the prune scripts
      - name: Assemble example apps
        if: ${{ matrix.run_example_tests && startsWith(matrix.agp, '9.') }}
        run: ./gradlew :example:assembleDebug :example-lib:assembleDebug :example-multi-app:assembleDebug --no-configuration-cache

      - name: "Test: pruneResourcesPreview detects unused resources correctly"
        if: ${{ matrix.run_example_tests }}
        run: ./scripts/test-preview.sh

      - name: "Test: pruneResourcesPreview detects multi-module usage correctly"
        if: ${{ matrix.run_example_tests }}
        run: ./scripts/test-preview-multi-module.sh

      - name: "Test: pruneResources removes unused resources"
        if: ${{ matrix.run_example_tests }}
        run: ./scripts/test-prune.sh

      - name: "Test: Aggregate pruneResourcesPreview detects unused resources"
        if: ${{ matrix.run_example_tests }}
        run: ./scripts/test-aggregate-preview.sh

      - name: "Test: Aggregate pruneResources removes unused resources"
        if: ${{ matrix.run_example_tests }}
        run: ./scripts/test-aggregate-prune.sh

      - name: "Test: Configuration Cache compatibility"
        if: ${{ matrix.run_example_tests }}
        run: ./scripts/test-configuration-cache.sh
